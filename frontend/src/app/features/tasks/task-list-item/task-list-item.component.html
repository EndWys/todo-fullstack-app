<h2
  class="h5 mb-2"
  [class.text-decoration-line-through]="taskSummary().isCompleted"
  [textContent]="taskSummary().title"
></h2>
<div class="d-flex flex-wrap gap-2 mb-2">
  <span class="badge text-bg-light border">{{
    taskSummary().isCompleted ? 'Completed' : 'Active'
  }}</span>
  <span class="badge text-bg-light border">Priority: {{ priorityDisplayLabel() }}</span>
</div>
<p class="small text-body-secondary mb-0">
  Created
  <time [attr.datetime]="taskSummary().createdAt">{{
    taskSummary().createdAt | date: 'medium'
  }}</time>
</p>
@if (taskSummary().completedAt; as completedAt) {
  <p class="small text-body-secondary mb-0">
    Completed <time [attr.datetime]="completedAt">{{ completedAt | date: 'medium' }}</time>
  </p>
}
